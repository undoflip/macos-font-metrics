name: site
on:
  push:
    branches: [main]
    paths: ['check_site.mjs', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  site:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright-core@1.48.2
      - run: mkdir -p results && node check_site.mjs results/site-${{ matrix.os }}.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "site ${{ matrix.os }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
