name: notdef
on:
  push:
    branches: [main]
    paths: ['measure_notdef.mjs', '.github/workflows/notdef.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notdef:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright-core@1.48.2
      - timeout-minutes: 30
        run: node measure_notdef.mjs results/notdef-${{ matrix.os }}.json
      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "results notdef ${{ matrix.os }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
