name: harvest
on:
  push:
    branches: [main]
    paths: ['harvest_fonts.py', 'measure_chrome.mjs', 'measure_glyphs.mjs', 'measure_pairs.mjs', 'measure_sizes.mjs', 'measure_fallback.mjs', 'measure_context.mjs', 'measure_context2.mjs', 'measure_probes.mjs', 'families.json', '.github/workflows/harvest.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fonttools==4.54.1
      - run: mkdir -p results && python3 harvest_fonts.py results/fonts-${{ matrix.os }}.json
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright-core@1.48.2
      - run: node measure_chrome.mjs results/chrome-widths-${{ matrix.os }}.json
      - run: node measure_glyphs.mjs results/glyph-widths-${{ matrix.os }}.json
      - run: node measure_pairs.mjs results/pairs-${{ matrix.os }}.json
      - run: node measure_sizes.mjs results/sizes-${{ matrix.os }}.json
      - run: node measure_fallback.mjs results/fallback-${{ matrix.os }}.json
      - run: node measure_context.mjs results/context-${{ matrix.os }}.json
      - run: node measure_context2.mjs results/context2-${{ matrix.os }}.json
      - run: ALL_FAMILIES=1 node measure_context2.mjs results/context3-${{ matrix.os }}.json
      - run: node measure_probes.mjs results/probes-${{ matrix.os }}.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "results ${{ matrix.os }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
